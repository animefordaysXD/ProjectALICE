# Alice configuration (packaged build).
# Model calls go through the OpenCode desktop app, signed in to OpenCode Go.
# Drop log files into .\logs and messages into .\messages.txt.

models:
  triage:      {provider: opencode, model: opencode-go/deepseek-v4.1-flash}
  reason:      {provider: opencode, model: opencode-go/deepseek-v4-pro}
  heavy:       {provider: opencode, model: opencode-go/kimi-k3.1-pro}
  consolidate: {provider: opencode, model: opencode-go/glm-5.3-flash, batch: true}

budget:
  soft_daily_usd: 1.00
  hard_daily_usd: 2.50
  max_escalations_per_hour: 6
  max_heavy_per_day: 3

triage:
  # Tuned for the one-time backlog drain: one batch per minute, larger batches.
  interval_minutes: 1
  max_batch_tokens: 6000

consolidation:
  hour: 3
  max_events: 500
  max_tokens: 6000

memory:
  core_memory_file: './memory/core.json'
  hard_max_tokens: 2000
  task_ttl_hours: 48
  recall_budget_tokens: 1000
  recall_k: 5
  embedding:
    model: minishlab/potion-multilingual-128M
    dimension: 256

plugins:
  enabled: []

sources:
  # Bounded whole-drive scan. The first run can take a few minutes; the file
  # list is then cached for refresh_minutes. Existing lines are not replayed
  # unless `from_start: true` is set.
  - type: logscan
    path: 'C:/'
    globs: ['*.log', '*.txt', '*.jsonl']
    max_files: 5000
    refresh_minutes: 30
    max_depth: 20
    recent_days: 14
    text_only: true
    from_start: false
    exclude_dirs:
      - Windows
      - Program Files
      - Program Files (x86)
      - ProgramData
      - $Recycle.Bin
      - System Volume Information
      - Recovery
      - PerfLogs
      - MSOCache
      - Config.Msi
      - Documents and Settings
      - $WinREAgent
      - $SysReset
      - .git
      - node_modules
      - __pycache__
      - .venv
      - venv
      - site-packages
      - build
      - dist
      - obj
  - {type: message, adapter: stub, path: './messages.txt'}

gate:
  min_salience: 0.5
  novelty_window_hours: 24
  source_weights: {logfile: 1.0, message: 1.2}

redaction:
  patterns:
    - {name: AWS_KEY, pattern: '\bAKIA[0-9A-Z]{16}\b'}

tools:
  # Read-only tool access. Web access is allowlisted by host suffix.
  web_domains: ['wikipedia.org']
  # Also allow other public hosts. Loopback/private/reserved addresses are
  # always refused, and redirects are re-checked.
  web_allow_public: true
  web_max_bytes: 500000
  web_timeout_seconds: 20
  calendar_file: './calendar.ics'
  email_enabled: false
  email_host: 'imap.naver.com'
  email_port: 993
  email_user_env: 'ALICE_NAVER_USER'
  email_password_env: 'ALICE_NAVER_APP_PASSWORD'
  email_max_messages: 5

ambient:
  # Local foreground-app and calendar monitoring. No keystrokes, screenshots,
  # clipboard, or browsing history.
  enabled: true
  calendar_lookahead_minutes: 30
  focus_minutes: 90
  idle_minutes: 30
  switch_window_minutes: 30
  switch_threshold: 20
  late_night_hour: 1
  max_alerts_per_hour: 2

monitor:
  # Local screen OCR for suggestion generation. The screenshot stays in memory;
  # only a redacted text excerpt is sent to the configured model.
  enabled: true
  capture_seconds: 20
  analyze_seconds: 120
  idle_seconds: 300
  max_ocr_chars: 2500
  min_confidence: 0.35
  max_suggestions_per_hour: 4
  use_accessibility: true
  max_ui_chars: 1200
  memory_seconds: 600
  exclude_apps: ['keepass.exe', 'keepassxc.exe', '1password.exe', 'bitwarden.exe', 'lastpass.exe', 'dashlane.exe']
  exclude_titles: ['password', 'incognito', 'private browsing', 'inprivate']
  excerpt_chars: 300

roam:
  # Time-boxed read-only exploration of the PC. No writes, commands, mail, or
  # settings changes. A session counts only time while Jo is idle unless the
  # explicit --now lease override is used.
  enabled: true
  idle_minutes: 5
  step_seconds: 300
  max_steps: 500
  memory_seconds: 600
  max_suggestions: 3
  allow_when_active: false

growth:
  # Slow-weighted dispositions learned from exploration sessions. Core memory
  # stays Jo-only; this is a separate, subordinate layer.
  enabled: true
  max_notes_per_session: 5
  max_weight: 0.80
  daily_decay: 0.995
  influence_alpha: 0.25
  render_max_tokens: 450
  min_weight: 0.03

actions:
  # Applying a fix always requires a fresh typed confirmation in the GUI.
  # Programs are resolved from PATH and run without a shell.
  enabled: true
  allowed_programs: ['winget', 'pip', 'python', 'git', 'opencode-cli']
  timeout_seconds: 120
  max_output_chars: 20000

files:
  # Read-only files you may attach to a chat question. Alice refuses paths
  # outside these roots. Use ['C:/'] only if you want the whole drive.
  roots: ['~']
  max_bytes: 262144
  max_files: 5

notify:
  # Toasts are disabled. Suggestions ping the in-app bell; the digest remains.
  mode: digest
  quiet_hours: '22:00-08:00'
  max_toasts_per_hour: 0
  min_toast_priority: 2

retention:
  raw_payload_days: 14
  max_raw_mb: 50

backup:
  enabled: true
  dir: backups
  hour: 4
  keep: 7
