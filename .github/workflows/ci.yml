name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Crash recovery proof
        run: powershell -ExecutionPolicy Bypass -File scripts/crash_recovery.ps1 -Runs 2 -KillAfterMs 700

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build executables
        run: powershell -ExecutionPolicy Bypass -File scripts/build_exe.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "alice-smoke"
          New-Item -ItemType Directory -Path $temp | Out-Null
          Copy-Item "dist\alice\config" "$temp\config" -Recurse
          .\dist\alice\alice.exe --version
          .\dist\alice\alice.exe --help | Out-String | Select-String "gui"
          .\dist\alice\alice.exe --config "$temp\config\alice.yaml" --data-dir "$temp\data" init
          .\dist\alice\alice.exe --config "$temp\config\alice.yaml" --data-dir "$temp\data" status
          .\dist\alice\alice.exe --config "$temp\config\alice.yaml" --data-dir "$temp\data" backup
          .\dist\alice\alice.exe --config "$temp\config\alice.yaml" --data-dir "$temp\data" report --write
          if (-not (Test-Path "dist\alice\alice-gui.exe")) { throw "GUI exe missing" }
          if (-not (Test-Path "dist\alice-windows-x64.zip")) { throw "zip missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: alice-windows-x64
          path: dist/alice-windows-x64.zip
          if-no-files-found: error
