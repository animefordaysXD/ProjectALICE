name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build executables
        run: powershell -ExecutionPolicy Bypass -File scripts/build_exe.ps1

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\alice\alice.exe")) { throw "CLI exe missing" }
          if (-not (Test-Path "dist\alice\alice-gui.exe")) { throw "GUI exe missing" }
          if (-not (Test-Path "dist\alice-windows-x64.zip")) { throw "zip missing" }
          .\dist\alice\alice.exe --version

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "dist/alice-windows-x64.zip" `
            --title "Alice $tag" `
            --generate-notes `
            --notes "Local, read-only secretary agent for Windows. Unzip, run Init Alice.cmd, then Run Alice.cmd or Alice GUI.cmd."
